dock_detector:
  ros__parameters:
    use_sim_time: true
    target_shape: rectangle
    # Three visible INNER faces of the rectangular bay.
    rectangle_width: 1.05
    rectangle_depth: 0.40
    dimension_tolerance: 0.10
    max_corner_gap: 0.18
    scan_topic: scan
    pose_topic: detected_dock_pose
    fixed_frame: odom
    expected_frame: map
    # Coarse prior only; account for the active map/world alignment.
    expected_dock_x: -1.0
    expected_dock_y: 3.0
    expected_dock_yaw: 0.0
    # Visible rear face centre is world (-1.425, 3.0); opening points +X.
    # Output is desired base_link parking XY, with +X toward the open side.
    # Apply no second translation in the docking plugin when using this output.
    target_to_dock_x: 0.425
    target_to_dock_y: 0.0
    search_radius: 0.85
    distance_threshold: 0.025
    min_points: 5
    min_length: 0.12
    max_length: 1.30
    expected_angle: 1.5707963267948966
    angle_tolerance: 0.20
    position_tolerance: 0.45
    yaw_tolerance: 0.45
    max_apex_gap: 0.25
    max_scan_age: 0.5
    detection_timeout: 0.6
