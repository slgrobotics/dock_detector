dock_detector:
  ros__parameters:
    use_sim_time: true
    target_shape: v
    # RANSAC geometry seed followed by robust fixed-template pose fitting.
    joint_refinement: true
    # Trapezoid template retained for shared node parameters; V mode uses two arms.
    trapezoid_width: 0.50
    trapezoid_depth: 0.421695722906443
    trapezoid_flare_angle: 0.5672320068981571
    # Allow rear-wall segments separated by the LiDAR blind sector.
    trapezoid_max_line_gap: 0.30
    dimension_tolerance: 0.05
    max_corner_gap: 0.10
    scan_topic: scan
    pose_topic: detected_dock_pose
    fixed_frame: odom
    expected_frame: map
    # Coarse prior only; account for the active map/world alignment.
    expected_dock_x: 0.0
    expected_dock_y: 6.0
    expected_dock_yaw: -1.5707963267948966
    # V inner apex is world (0.0, 6.6); opening points world -Y.
    # Output is desired base_link parking XY, with +X toward the open side.
    # Apply no second translation in the docking plugin when using this output.
    # V final (0,6), staging (0,5.2), yaw -pi/2; scalar offset is 0.60 m.
    v_offset: 0.60
    trapezoid_offset: 0.425
    search_radius: 0.95
    distance_threshold: 0.025
    min_points: 5
    min_length: 0.12
    max_length: 1.30
    # V fixed choice: 55 degrees per arm, 110 degree included opening.
    expected_angle: 1.9198621771937625
    angle_tolerance: 0.20
    position_tolerance: 0.45
    yaw_tolerance: 0.45
    max_apex_gap: 0.25
    max_scan_age: 0.5
    detection_timeout: 0.6
